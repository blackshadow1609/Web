    ----------------------Типы данных.-----------------------------------------------------------
    Примитивы.
    Типы данных в языке JavaScript разделяются на примитивные типы и объекты. В свою очередь примитивные типы можно разделить на числовые типы и не числовые типы.
    -----К числовым типам относятся:
    а) Number - представляет собой вещественное число двойной точности, так же как Double в С++.
    б) Bigint - представляет собой целое число неограниченного размера. Реализует длинную арифметику.

    -----К не числовым типам относятся:
    а) String - строки. Строковую константу можно создать одинарными, двойными либо обратными кавычками. Пара одинарных или двойных кавычек равнозначна. Обратные одинарные кавычки используются при интерпаляции строк.
    б) Boolean - false, true.
    в) Null - отсутствие какого либо значения.
    г) Undefined - это когда объект есть, но ему не присвоено начальное значение.
    д) Symbol - создание уникальных и неизменяемых идентификаторов, которые можно использовать в качестве ключей для свойств объектов. Это гарантирует, что свойство с ключом-Symbol не будет случайно перезаписано или конфликтовать с другими ключами (даже если они имеют то же строковое имя).

    Абсолютно все типы как примитивы так и объекты являются ссылочными.

    Объекты.
    Объекты в JS — это составные типы данных (ссылочные типы), которые хранят коллекции пар ключ:значение. В отличие от примитивов, объекты хранятся и передаются по ссылке.
    Object (Объект)-Базовый тип для создания коллекций пар "ключ-значение". Используется для хранения структурированных данных, например, свойств сущности (пользователя, товара).

а) Array (Массив)-Упорядоченная коллекция элементов с числовой индексацией. Используется для хранения списков данных (строк, чисел, объектов и т.д.).

б) Function (Функция)-Объект, который может быть вызван для выполнения кода. Содержит тело функции и может иметь свойства, как обычный объект.

в) Date (Дата)-Представляет дату и время. Предоставляет методы для работы с временными данными (форматирование, сравнение, вычисления).

г) RegExp (Регулярное выражение)-Шаблон для поиска и обработки текста. Используется для проверки строк на соответствие формату, поиска и замены подстрок.

д)Set (Множество)-Коллекция УНИКАЛЬНЫХ значений любого типа (ES6+). Полезен для хранения неповторяющихся элементов и быстрой проверки наличия значения.

е) Map (Словарь/Карта)-Коллекция пар "ключ-значение", где ключи могут быть любого типа (в отличие от обычных объектов, где ключи только строки). Сохраняет порядок добавления элементов.
--------------------------------------------------------------------------
    Переменные в JS можно объявить с помощью let, var либо const.
    let - объявляет локальную переменную в пределах области видимости.
    var - объявляет глобальную переменную. Если var применить в области видимости, то он будет доступен и по завершении этой области.
    const - объявляет константу: переменную, которую нельзя переопределить после инициализации (изменить её значение).
