<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>JavaScript PD_411</title>
    <link rel="icon" href="/javascript.ico">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Introduction</h1>
    <details>
        <summary>Factorial</summary>
        <input type="number" id="factorial-source" min=0 placeholder="Исходное число для вычисления Факториала" onchange="Factorial2()" />
        <div id="factorial-result"></div>
    </details>
    <details>
        <summary>Power</summary>
        <input type="number" id="power-base" placeholder="Основание" min="-999" max="999" onchange="calculatePower()" />
        <input type="number" id="power-exponent" placeholder="Показатель степени" min="-999" max="999" onchange="calculatePower()" />
        <div id="power-result"></div>
        <script>
            function calculatePower() {
                const base = document.getElementById('power-base').value;
                const exponent = document.getElementById('power-exponent').value;
                const resultElement = document.getElementById('power-result');

                if (base === '' || exponent === '') {
                    resultElement.innerHTML = '';
                    return;
                }

                const numBase = parseFloat(base);
                const numExponent = parseFloat(exponent);
                const result = Math.pow(numBase, numExponent);

                resultElement.innerHTML = `Результат: ${numBase}<sup>${numExponent}</sup> = ${result}`;
            }
        </script>
    </details>
    <details>
        <summary>Fibonacci Series</summary>
        <div>
            <label>
                <input type="radio" name="fibonacci-type" value="limit" checked onchange="toggleFibonacciInput()" />
                По пределу (максимальное число)
            </label>
            <label>
                <input type="radio" name="fibonacci-type" value="count" onchange="toggleFibonacciInput()" />
                По количеству членов
            </label>
        </div>
        <input type="number" id="fibonacci-limit" placeholder="Максимальное число в ряде" min="0" onchange="calculateFibonacci()" />
        <input type="number" id="fibonacci-count" placeholder="Количество членов ряда" min="1" style="display: none;" onchange="calculateFibonacci()" />
        <div id="fibonacci-result"></div>

        <script>
            function toggleFibonacciInput() {
                const type = document.querySelector('input[name="fibonacci-type"]:checked').value;
                const limitInput = document.getElementById('fibonacci-limit');
                const countInput = document.getElementById('fibonacci-count');

                if (type === 'limit') {
                    limitInput.style.display = '';
                    countInput.style.display = 'none';
                    limitInput.value = '';
                    countInput.value = '';
                } else {
                    limitInput.style.display = 'none';
                    countInput.style.display = '';
                    limitInput.value = '';
                    countInput.value = '';
                }
                document.getElementById('fibonacci-result').innerHTML = '';
            }

            function calculateFibonacci() {
                const type = document.querySelector('input[name="fibonacci-type"]:checked').value;
                const limitInput = document.getElementById('fibonacci-limit');
                const countInput = document.getElementById('fibonacci-count');
                const resultElement = document.getElementById('fibonacci-result');

                let value;
                if (type === 'limit') {
                    value = limitInput.value;
                    if (value === '') {
                        resultElement.innerHTML = '';
                        return;
                    }
                    generateFibonacciByLimit(parseInt(value));
                } else {
                    value = countInput.value;
                    if (value === '') {
                        resultElement.innerHTML = '';
                        return;
                    }
                    generateFibonacciByCount(parseInt(value));
                }
            }

            function generateFibonacciByLimit(limit) {
                if (limit < 0) {
                    document.getElementById('fibonacci-result').innerHTML = 'Предел должен быть неотрицательным';
                    return;
                }

                let fib = [0, 1];
                let next;

                if (limit === 0) {
                    fib = [0];
                } else {
                    while ((next = fib[fib.length - 1] + fib[fib.length - 2]) <= limit) {
                        fib.push(next);
                    }
                }

                document.getElementById('fibonacci-result').innerHTML =
                    `Ряд Фибоначчи до ${limit}:<br><strong>${fib.join(', ')}</strong>`;
            }

            function generateFibonacciByCount(count) {
                if (count < 1) {
                    document.getElementById('fibonacci-result').innerHTML = 'Количество должно быть не меньше 1';
                    return;
                }

                let fib = [];
                if (count >= 1) fib.push(0);
                if (count >= 2) fib.push(1);

                for (let i = 2; i < count; i++) {
                    fib.push(fib[i - 1] + fib[i - 2]);
                }

                document.getElementById('fibonacci-result').innerHTML =
                    `Первые ${count} чисел ряда Фибоначчи:<br><strong>${fib.join(', ')}</strong>`;
            }

            toggleFibonacciInput();
        </script>
    </details>
    <script src="script.js"></script>   <!--подключение файла script.js-->
    <script>
        console.log("Hello World!");
       
    </script>
</body>
</html>

    ----------------------Типы данных.-----------------------------------------------------------
    Примитивы.
    Типы данных в языке JavaScript разделяются на примитивные типы и объекты. В свою очередь примитивные типы можно разделить на числовые типы и не числовые типы.
    -----К числовым типам относятся:
    а) Number - представляет собой вещественное число двойной точности, так же как Double в С++. (занимает 8 байт памяти)
    б) Bigint - представляет собой целое число неограниченного размера. Реализует длинную арифметику.
    Длиная арифметика это подход, при котором число не ограничевается каким то объемом памяти, а ограничивается лишь объемом свободной памяти компьютера.
    В длиной арифметике проблема арифметического переполнения, решена динамическим увеличением разрядности числа.

    -----К не числовым типам относятся:
    а) String - строки. Строковую константу можно создать одинарными, двойными либо обратными кавычками. Пара одинарных или двойных кавычек равнозначна. Обратные одинарные кавычки используются при интерпаляции строк.
    б) Boolean - false, true.
    в) Null - отсутствие какого либо значения.
    г) Undefined - это когда объект есть, но ему не присвоено начальное значение.
    д) Symbol - создание уникальных и неизменяемых идентификаторов, которые можно использовать в качестве ключей для свойств объектов. Это гарантирует, что свойство с ключом-Symbol не будет случайно перезаписано или конфликтовать с другими ключами (даже если они имеют то же строковое имя).

    Абсолютно все типы как примитивы так и объекты являются ссылочными.

    Объекты.
    Объекты в JS — это составные типы данных (ссылочные типы), которые хранят коллекции пар ключ:значение. В отличие от примитивов, объекты хранятся и передаются по ссылке.
    Object (Объект)-Базовый тип для создания коллекций пар "ключ-значение". Используется для хранения структурированных данных, например, свойств сущности (пользователя, товара).

а) Array (Массив)-Упорядоченная коллекция элементов с числовой индексацией. Используется для хранения списков данных (строк, чисел, объектов и т.д.).

б) Function (Функция)-Объект, который может быть вызван для выполнения кода. Содержит тело функции и может иметь свойства, как обычный объект.

в) Date (Дата)-Представляет дату и время. Предоставляет методы для работы с временными данными (форматирование, сравнение, вычисления).

г) RegExp (Регулярное выражение)-Шаблон для поиска и обработки текста. Используется для проверки строк на соответствие формату, поиска и замены подстрок.

д)Set (Множество)-Коллекция УНИКАЛЬНЫХ значений любого типа (ES6+). Полезен для хранения неповторяющихся элементов и быстрой проверки наличия значения.

е) Map (Словарь/Карта)-Коллекция пар "ключ-значение", где ключи могут быть любого типа (в отличие от обычных объектов, где ключи только строки). Сохраняет порядок добавления элементов.
--------------------------------------------------------------------------
    Переменные в JS можно объявить с помощью let, var либо const.
    let - объявляет локальную переменную в пределах области видимости.
    var - объявляет глобальную переменную. Если var применить в области видимости, то он будет доступен и по завершении этой области.
    const - объявляет константу: переменную, которую нельзя переопределить после инициализации (изменить её значение).
