<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="icon" href="/javascript.ico">
    <link rel="stylesheet" href="events.css">
</head>
<body class="white">
    <header id="header">
        <div>Координаты мыши:</div>
        <span id="mouse"></span>
        <div>
            <label for="delay">Delay: </label>
            <input type="number" id="delay" min="1" max="5" value="3">
            <button onclick="switchBackground()" style="background: none; border: none; cursor: pointer;">
                <img src="image/moon.png" id="switch-background" alt="Переключить тему">
            </button>
        </div>
    </header>
    <!--------------------------------------------------------------------------------------->
        <h1>Events</h1>
        <hr>
        <details>
            <summary>Image & Color</summary>
            <div id="photo-and-color">
                <section id="select-photo" class="block">
                    <h2>Выберите фото</h2>
                    <div id="photo-container">
                        <img alt="Фото студента" title="Фото" id="photo" src="image/placeholder.jpg">
                    </div>
                    <input type="file" id="image-file" onchange="setImage()" accept="image/*">
                </section>

                <section id="select-color" class="block">
                    <h2>Выберите цвет</h2>
                    <div>
                        <input type="color" id="choose-color" onchange="setBackground()">
                        <label for="choose-color">Выберите Ваш любимый цвет</label>
                    </div>
                    <div id="color-sample"></div>
                </section>
            </div>
        </details>
        <!--------------------------------------------------------------------------------------->
        <hr>
        <details>
            <summary>Arrays</summary>
            <script>
                let arr = [3, 5, 8, 13, 21];
                console.log(arr);

                let values = [true, false, '+', 3.14, "Hello", 2.7];
                document.write(`<pre>`);
                for (let i = 0; i < arr.length; i++) {
                    document.write(`${arr[i]}\t`);
                }
                document.write(`</pre>`);
                console.log(values);
                console.table(values);

                let matrix =
                    [
                        [1, 2, 3],
                        [4, 5, 6],
                        [7, 8, 9],

                    ];
                document.write(`<pre>`);

                matrix.forEach((element) => document.write(element));
                document.writeln();
                for (let i = 0; i < matrix.length; i++) {
                    for (let j = 0; j < matrix[i].length; j++) {
                        document.write(`${matrix[i][j]}\t`);
                    }
                    document.writeln();
                }
                document.write(`</pre>`);
                console.log(matrix);
                console.table(matrix);

                let jaggedArr =
                    [
                        [3, 5, 8, 13, 21],
                        ["Хорошо", "живет", "на", "свете", "Винни", "Пух"],
                        [34, 55, 89,]
                    ];
                console.log(jaggedArr);
                console.table(jaggedArr);
            </script>
        </details>
        <!--------------------------------------------------------------------------------------->
        <hr>
        <details>
            <summary>Time</summary>
            <div id="current-time">
                <div id="full-time"></div>
                <div id="clock">
                    <span id="hours"></span>:
                    <span id="minutes"></span>:
                    <span id="seconds"></span>
                </div>
                <div id="current-date">
                    <span id="years"></span>/
                    <span id="months"></span>/
                    <span id="days"></span>
                </div>
                <div id="day-of-week"></div>
                <input type="checkbox" id="show-date"><label for="show-date">Показать дату</label>
                <input type="checkbox" id="show-weekday"><label for="show-weekday">Показать день недели</label>
            </div>
        </details>
        <hr>
        <details>
            <summary>CountDown Timer</summary>
            <div id="countdown-timer">
                <input type="date" id="target-date" value="2026-02-28">
                <input type="time" id="target-time" value="16:30">
                <input type="button" id="btn-start" value="Start">
            </div>
            <div id="debug">
                <div id="target-date-value"></div>
                <div id="target-time-value"></div>
                <div id="current-time-value"></div>
                <div id="duration"></div>
                <div id="timestamp"></div>
                <div id="value-type"></div>
            </div>
            <h3 id="signature"></h3>
            <div id="display">
                <div class="time-block">
                    <div id="hours-unit" class="time-unit">hh</div>
                    <div id="hours-marker" class="time-marker">Hours</div>
                </div>
                <div class="time-block">
                    <div id="minutes-unit" class="time-unit">mm</div>
                    <div id="minutes-marker" class="time-marker">Minutes</div>
                </div>
                <div class="time-block">
                    <div id="seconds-unit" class="time-unit">ss</div>
                    <div id="seconds-marker" class="time-marker">Seconds</div>
                </div>
            </div>
            <hr>
            <div>
                <audio controls id="player" style="width: 100%">
                    <source src="sound/Accept_-_All_Or_Nothing.mp3">
                </audio>
            </div>
            <div id="audio-selector" style="margin: 25px 0;">
                <label for="audio-track">Выберите мелодию: </label>
                <select id="audio-track" onchange="changeAudioTrack()">
                    <option value="">-- Выберите мелодию --</option>
                    <option value="sound/Accept_-_Balls_To_The_Wall.mp3">Balls To The Wall</option>
                    <option value="sound/Accept_-_Fast_As_A_Shark.mp3">Fast As A Shark</option>
                    <option value="sound/Accept_-_Breaker.mp3">Breaker</option>
                    <option value="sound/Accept_-_Breaking_Up_Again.mp3">Breaking Up Again</option>
                    <option value="sound/Accept_-_Burning.mp3">Burning</option>
                    <option value="sound/Accept_-_Cant_Stand_The_Night.mp3">Cant Stand The Night</option>
                    <option value="sound/Accept_-_All_Or_Nothing.mp3">All Or Nothing</option>
                </select>
            </div>

            <script>
                function changeAudioTrack() {
                    const select = document.getElementById('audio-track');
                    const player = document.getElementById('player');
                    const source = player.querySelector('source');

                    if (select.value) {
                        source.src = select.value;
                        player.load();
                        player.play(); 
                    }
                }
            </script>
        </details>
        <hr>

    <script src="events.js"></script>
</body>
</html>
