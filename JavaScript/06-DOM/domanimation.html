<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>DOM Animation</title>
    <link rel="icon" href="javascript.ico">
    <link rel="stylesheet" href="domanimation.css">

</head>
<body>
    <div id="controls">
        <button onclick="toggleMove()">Start/Stop</button>
        <button onclick="stopMove()">Stop</button><br><br>

        <label>Скорость (кадров/сек): </label>
        <input type="number" id="interval" min="1" max="120" value="60" /><br><br>

        <label>Размер шрифта: </label>
        <input type="number" id="fontSize" min="10" max="72" value="16"
               onchange="updateFontSize()" /><br><br>

        <button onclick="changeSettings()">Применить</button>
    </div>

    <div id="animation"></div>

    <script src="domanimation.js"></script>
</body>
</html>
